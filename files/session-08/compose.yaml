# PostgreSQL for the SQL labs.  Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - shop-data:/var/lib/postgresql/data
volumes:
  shop-data:
