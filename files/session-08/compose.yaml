# PostgreSQL for the SQL labs.  Start: docker compose up -d   Stop: docker compose down
# Browse the tables in a browser: Adminer at http://localhost:8081, pgAdmin at http://localhost:5050
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - shop-data:/var/lib/postgresql/data

  # Like phpMyAdmin. Login: System PostgreSQL, Server db, user postgres, password postgres, database shop
  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db

  # The official PostgreSQL GUI. No pgAdmin login; the shop server is already registered (password postgres)
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
volumes:
  shop-data:
  pgadmin-data:
