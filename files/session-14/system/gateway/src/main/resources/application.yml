server:
  port: 8000                        # the ONLY port the outside world sees (see ../compose.yaml)

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Checked top to bottom, the first match wins: the specific route goes first
            - id: notifications
              uri: ${NOTIFICATIONS_URL:http://localhost:8081}
              predicates:
                - Path=/api/notifications/**, /api/notifications
              filters:
                - AddResponseHeader=X-Served-By, notification-service
            - id: task-api
              uri: ${TASK_API_URL:http://localhost:8080}
              predicates:
                - Path=/api/**, /swagger-ui.html, /swagger-ui/**, /v3/api-docs/**
              filters:
                - AddResponseHeader=X-Served-By, task-api

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway   # /actuator/gateway/routes lists the routes it loaded
  endpoint:
    health:
      probes:
        enabled: true
