server:
  port: 8000                        # the ONLY port the outside world sees (see ../compose.yaml)

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          # Add X-Forwarded-Host/Proto/Port so the services know the PUBLIC address (localhost:8000),
          # for example for Swagger's "Try it out". Only for callers on private networks (your laptop, Docker).
          trusted-proxies: (127\..*|10\..*|172\.(1[6-9]|2[0-9]|3[01])\..*|192\.168\..*|0:0:0:0:0:0:0:1|::1)
          routes:
            # Checked top to bottom, the first match wins: the specific route goes first
            - id: notifications
              uri: ${NOTIFICATIONS_URL:http://localhost:8081}
              predicates:
                - Path=/api/notifications/**, /api/notifications
              filters:
                - AddResponseHeader=X-Served-By, notification-service
            - id: task-api
              uri: ${TASK_API_URL:http://localhost:8080}
              predicates:
                - Path=/api/**, /swagger-ui.html, /swagger-ui/**, /v3/api-docs/**
              filters:
                - AddResponseHeader=X-Served-By, task-api

management:
  endpoints:
    web:
      exposure:
        include: health, info            # Gateway MVC has no /actuator/gateway endpoint (only the WebFlux gateway has one)
  endpoint:
    health:
      probes:
        enabled: true
