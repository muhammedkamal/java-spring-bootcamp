# GitHub Actions: build and test on every push and pull request.
# Put this file in YOUR repository at .github/workflows/ci.yml (the project is the repo root).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest          # has Docker, so Testcontainers just works
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven               # reuse ~/.m2 between runs: much faster

      - name: Build, unit tests, integration tests, coverage check
        run: mvn -B verify           # -B = batch mode: clean logs, no colours

      - name: Upload the test and coverage reports
        if: always()                 # also when the build failed: that is when you need them
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
